<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Speccy Jams 2</title>
        <script src="jsspeccy/jsspeccy.js"></script>
        <style>
            body { background-color: #222; color: #ccc; font-family: monospace; text-align: center; }
            #jsspeccy { width: 640px; margin: 20px auto; background-color: white; }
        </style>
    </head>
    <body onload="emu = JSSpeccy(document.getElementById('jsspeccy'), {zoom: 2, machine: 48, openUrl: 'jams2.tap', autoLoadTapes: true})">

        <p>Click play (browsers need a click before audio). SPACE stops the music, then P = play again, Q = quit. <a href="index.html" style="color:#8cf">Jams 1</a></p>
    </body>
</html>
